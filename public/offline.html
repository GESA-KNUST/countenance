<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · GESA-KNUST</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f9fafb;
            color: #111827;
        }
        .card {
            max-width: 26rem;
            width: 100%;
            text-align: center;
            background: #fff;
            border: 1px solid #f3f4f6;
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.15);
        }
        .badge {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1.5rem;
            border-radius: 9999px;
            background: #fef2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
        }
        h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
        p { color: #6b7280; line-height: 1.6; margin: 0 0 1.75rem; }
        button {
            border: 0;
            cursor: pointer;
            background: #000;
            color: #fff;
            font-weight: 700;
            padding: 0.9rem 2.5rem;
            border-radius: 9999px;
            font-size: 1rem;
            transition: background 0.2s ease;
        }
        button:hover { background: #1f2937; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">📡</div>
        <h1>You're offline</h1>
        <p>We couldn't reach the network. Check your connection and try again — previously visited pages may still be available.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
